# Mission Bridge Node - Production Parameters
# ===========================================
#
# Configuration for production deployment with real Nav2 stack.
# This is the full VDA5050 mission bridge with actual navigation capabilities.

mission_bridge_node:
  ros__parameters:
    # ========================================================================
    # MQTT Broker Configuration
    # ========================================================================
    mqtt_broker: "localhost"
    mqtt_port: 1883
    mqtt_username: ""
    mqtt_password: ""
    
    # ========================================================================
    # AGV Identity (VDA5050)
    # ========================================================================
    # NOTE: These fallback values are automatically overridden by the ROS2 launch files
    # using the $ROBOT_ID and $MANUFACTURER environment variables.
    manufacturer: "MowbotTech" 
    serial_number: "MB001"
    vda5050_version: "2.0"
    vda5050_interface: "uagv"
    
    # ========================================================================
    # GPS Reference Point
    # ========================================================================
    # Set your local GPS origin point (where robot spawns / starts)
    gps_lat_ref: 37.5665  # Seoul City Hall (example)
    gps_lon_ref: 126.9780
    gps_frame_id: "map"  # Must be "map" for Nav2 compatibility (FromLL outputs in map frame)
    
    # GPS Conversion Method:
    # - "reference_based": Simple flat-earth approximation (fast, good for <100km)
    # - "robot_localization": Use robot_localization FromLL service (requires navsat_transform_node)
    gps_conversion_method: "robot_localization"
    
    # ========================================================================
    # GPS and Heading Topics
    # ========================================================================
    gps_topic: "/gnss/fix_filtered"      # NavSatFix topic for position
    # gps_topic: "/gnss/fix"
    heading_topic: "/gnss/heading"        # Raw GNSS compass Imu (auxiliary info + theta fallback)
    odom_topic: "/odometry/local"         # Odometry topic for velocity (vx, vy, omega)
    base_frame: "base_footprint"         # TF frame for VDA5050 agvPosition.theta
    # Note: dual_gnss_compass publishes heading with heading_offset_rad: 1.5708
    #       which converts from ENU to compass/NED convention
    
    # ========================================================================
    # Navigation Settings (Real Nav2)
    # ========================================================================
    nav_timeout: 120.0  # Navigation timeout in seconds (2 minutes for real navigation)
    nav2_action_server: "navigate_through_poses"  # NavigateThroughPoses action server name
    # nav2_action_server: "navigate_to_pose" 
    mission_start_delay: 2.0  # Delay in seconds after receiving mission before movement starts
    start_node_tolerance: 1.0  # Meters: lead-in navigate if robot is farther than this from first order node
    # ========================================================================
    # State Publishing
    # ========================================================================
    state_publish_rate: 2.0  # Hz (1 = publish state every 1 second)
    
    # ========================================================================
    # Message Validation
    # ========================================================================
    validate_vda5050_messages: true  # Enable VDA5050 message validation
    
    # ========================================================================
    # Diagnostics Settings
    # ========================================================================
    diagnostics_topic: "/diagnostics"
    base_diagnostics_topic: "/mowbot_base/diagnostics"
    driving_mode_key: "control_mode"
    manual_mode_value: "MANUAL"
    auto_mode_value: "AUTO"
    
    # ========================================================================
    # Order Processing
    # ========================================================================
    accept_orders_when_busy: false  # Reject new orders while executing existing order

    # ========================================================================
    # Dynamic Global Costmap Resize (Optional)
    # ========================================================================
    # When enabled, the bridge resizes /global_costmap/global_costmap to fit
    # each mission's bounding box (rolling_window=false). Lead-in navigation
    # still uses the default rolling costmap. Defaults restored on mission end.
    costmap_resize:
      enabled: true
      target_node: "/global_costmap/global_costmap"
      margin_m: 9.0              # padding around mission bbox (m)
      min_size_m: 20.0           # minimum width/height (m)
      max_size_m: 1000.0          # max width/height; above this falls back to rolling
      param_timeout_s: 10.0
      init_timeout_s: 30.0       # retry window for costmap snapshot at startup
      init_retry_period_s: 1.0   # seconds between snapshot retries

    # ========================================================================
    # Path Segmentation (Optional)
    # ========================================================================
    # Split mission paths into smaller segments executed sequentially.
    # Each segment runs as one NavigateThroughPoses goal and (if
    # costmap_resize.enabled) gets its own dynamic costmap fit.
    # Lead-in navigation runs once before segment 0 only.
    # Continuous-mode only; ignored when nav2_action_server is navigate_to_pose.
    # Disable by setting enabled=false (or max_segment_length_m=0).
    path_segmentation:
      enabled: true
      max_segment_length_m: 10.0           # cumulative path length per segment (m); 0 = no limit
      overlap_waypoints: 1                  # last wp of segment K == first of K+1
      clear_costmap_between_segments: true

