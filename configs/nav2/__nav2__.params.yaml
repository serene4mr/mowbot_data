behavior_server:
  ros__parameters:
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    backup:
      plugin: nav2_behaviors/BackUp
    behavior_plugins:
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    costmap_topic: local_costmap/costmap_raw
    cycle_frequency: 10.0
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    max_rotational_vel: 1.5
    min_rotational_vel: 1.2
    robot_base_frame: base_footprint
    rotational_acc_lim: 3.2
    simulate_ahead_time: 2.0
    transform_tolerance: 0.1
    use_sim_time: false
    wait:
      plugin: nav2_behaviors/Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_nav_through_poses_bt_xml: __BT_NAV_THROUGH_POSES__
    default_nav_to_pose_bt_xml: __BT_NAV_TO_POSE__
    default_server_timeout: 20
    global_frame: map
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    odom_topic: /odometry/local
    robot_base_frame: base_footprint
    wait_for_service_timeout: 1000
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    FollowPath:
      approach_velocity_scaling_dist: 1.0
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      desired_linear_vel: 0.25
      inflation_cost_scaling_factor: 3.0
      lookahead_dist: 1.2
      lookahead_time: 1.5
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_accel: 3.2
      max_lookahead_dist: 1.2
      max_robot_pose_search_dist: 10.0
      min_approach_linear_velocity: 0.05
      min_lookahead_dist: 0.3
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      rotate_to_heading_angular_vel: 0.9
      rotate_to_heading_min_angle: 0.785
      transform_tolerance: 0.1
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: false
      use_interpolation: false
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    failure_tolerance: 0.3
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.5
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    odom_topic: /odometry/local
    progress_checker:
      movement_time_allowance: 15.0
      plugin: nav2_controller::PoseProgressChecker
      required_movement_angle: 0.1
      required_movement_radius: 0.1
    progress_checker_plugin: progress_checker
    use_sim_time: false
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[ [-0.775, 0.7], [0.775, 0.7], [0.775, -0.7], [-0.775, -0.7] ]'
      global_frame: map
      height: 50
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.75
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: ''
        plugin: nav2_costmap_2d::ObstacleLayer
      origin_x: 0.0
      origin_y: 0.0
      plugins:
      - inflation_layer
      - obstacle_layer
      publish_frequency: 1.0
      resolution: 0.1
      robot_base_frame: base_footprint
      rolling_window: true
      semantic_segmentation_layer:
        camera:
          class_types:
          - cuttable
          - traversable
          - non-traversable
          confidence_topic: /segmentation/confidence
          cuttable:
            base_cost: 0
            classes:
            - cuttable
            dominant_priority: false
            mark_confidence: 0
            max_cost: 0
            samples_to_max_cost: 0
          expected_update_rate: 0.0
          labels_topic: /segmentation/label_info
          max_obstacle_distance: 5.0
          min_obstacle_distance: 0.3
          non-traversable:
            base_cost: 0
            classes:
            - non-traversable
            dominant_priority: true
            mark_confidence: 180
            max_cost: 254
            samples_to_max_cost: 3
          observation_persistence: 0.0
          pointcloud_topic: /camera/camera/depth/color/points
          segmentation_topic: /segmentation/mask
          sync_slop: 0.05
          tile_map_decay_time: 3.0
          traversable:
            base_cost: 50
            classes:
            - traversable
            dominant_priority: false
            mark_confidence: 0
            max_cost: 50
            samples_to_max_cost: 2
          use_cost_selection: true
          visualize_tile_map: true
        enabled: true
        observation_sources: camera
        plugin: mowbot_semantic_segmentation_layer::SemanticSegmentationLayer
      track_unknown_space: false
      update_frequency: 1.0
      use_sim_time: false
      width: 50
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[ [-0.6915, 0.699], [0.6915, 0.699], [0.6915, -0.699], [-0.6915,
        -0.699] ]'
      global_frame: odom
      height: 3
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.75
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          topic: /scan
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_footprint
      rolling_window: true
      update_frequency: 5.0
      use_sim_time: false
      width: 3
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
    expected_planner_frequency: 20.0
    planner_plugins:
    - GridBased
    use_sim_time: false
robot_state_publisher:
  ros__parameters:
    use_sim_time: false
smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
    use_sim_time: false
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: OPEN_LOOP
    max_accel:
    - 2.0
    - 0.0
    - 2.5
    max_decel:
    - -2.0
    - 0.0
    - -2.5
    max_velocity:
    - 1.0
    - 0.0
    - 1.8
    min_velocity:
    - -1.0
    - 0.0
    - -1.8
    odom_duration: 0.1
    odom_topic: odometry/local
    scale_velocities: false
    smoothing_frequency: 20.0
    use_sim_time: false
    velocity_timeout: 1.0
