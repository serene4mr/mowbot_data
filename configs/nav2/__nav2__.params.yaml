bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Custom BTs with Spin recovery removed (mower should never rotate in place).
    # Paths are injected at launch via RewrittenYaml param_rewrites from data_path.
    default_nav_to_pose_bt_xml: "__BT_NAV_TO_POSE__"
    default_nav_through_poses_bt_xml: "__BT_NAV_THROUGH_POSES__"

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []


bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False


controller_server:
  ros__parameters:            
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]    
    odom_topic: /odometry/local 

    # Progress checker parameters
    progress_checker:
      # plugin: "nav2_controller::SimpleProgressChecker"
      # required_movement_radius: 0.1 # meters
      # movement_time_allowance: 15.0 # seconds
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.1 # meters
      required_movement_angle: 0.1 # radians
      movement_time_allowance: 15.0 # seconds

    # Goal checker parameters
    general_goal_checker: 
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5   # meters
      yaw_goal_tolerance: 0.5   # radians

    FollowPath: 
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 1.2
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.9
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      use_interpolation: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[ [-0.6915, 0.699], [0.6915, 0.699], [0.6915, -0.699], [-0.6915, -0.699] ]"  
      plugins: 
        - "obstacle_layer"
        - "inflation_layer"
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.75

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[ [-0.6915, 0.699], [0.6915, 0.699], [0.6915, -0.699], [-0.6915, -0.699] ]"   
      resolution: 0.1            
      width: 10                     
      height: 10
      origin_x: 0.0
      origin_y: 0.0
      rolling_window: True
      track_unknown_space: false
      plugins: 
        # - "semantic_segmentation_layer"
        - "inflation_layer"
        - "obstacle_layer"
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: ""
        # scan:
        #   topic: /scan
        #   max_obstacle_height: 2.0
        #   clearing: True
        #   marking: True
        #   data_type: "LaserScan"
        #   raytrace_max_range: 3.0
        #   raytrace_min_range: 0.0
        #   obstacle_max_range: 2.5
        #   obstacle_min_range: 0.0

      semantic_segmentation_layer:
        plugin: "mowbot_semantic_segmentation_layer::SemanticSegmentationLayer"
        enabled: true
        observation_sources: camera
        camera:
          segmentation_topic: "/segmentation/mask" #"/segmentation/mask" 
          confidence_topic: "/segmentation/confidence" #"/segmentation/confidence"
          labels_topic: "/segmentation/label_info"
          pointcloud_topic: "/camera/camera/depth/color/points" #"/segmentation/points" #"/rgbd_camera/depth/points"
          observation_persistence: 0.0
          expected_update_rate: 0.0
          visualize_tile_map: true
          use_cost_selection: true
          # Optional per-source max stamp skew for ApproximateTime (sec). Omit or use -1 for layer default.
          sync_slop: 0.05
          max_obstacle_distance: 5.0
          min_obstacle_distance: 0.3
          tile_map_decay_time: 3.0 #2.0

          # class_types: ["traversable", "danger"]

          # traversable:
          #   classes: ["traversable", "cuttable"]
          #   base_cost: 0
          #   max_cost: 0
          #   mark_confidence: 0
          #   samples_to_max_cost: 0
          #   dominant_priority: false

          # danger:
          #   classes: ["non-traversable"]
          #   base_cost: 254
          #   max_cost: 254
          #   mark_confidence: 0
          #   samples_to_max_cost: 5
          #   dominant_priority: true

          class_types: ["cuttable", "traversable", "non-traversable"]

          cuttable:
            classes: ["cuttable"]
            base_cost: 0 #254
            max_cost: 0
            mark_confidence: 0 #128
            samples_to_max_cost: 0
            dominant_priority: false

          traversable:
            classes: ["traversable"]
            base_cost: 50 #254          # Base penalty for driving here
            max_cost: 50           # Max penalty
            mark_confidence: 0 #128   # Add some confidence filtering
            samples_to_max_cost: 2
            dominant_priority: false

          non-traversable:
            classes: ["non-traversable"]
            base_cost: 0           # Ignore it (treat as free) until we are sure
            max_cost: 254          # LETHAL once confirmed
            mark_confidence: 180   # Must be > 70% confident
            samples_to_max_cost: 3 # Must see it for 3 frames to confirm
            dominant_priority: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.75
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "assisted_teleop", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 1.2
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.0, 1.8]
    min_velocity: [-1.0, 0.0, -1.8]
    max_accel: [2.0, 0.0, 2.5]
    max_decel: [-2.0, 0.0, -2.5]
    odom_topic: "odometry/local" # only works if in CLOSED_LOOP
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0