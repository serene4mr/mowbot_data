broker:
  host: localhost
  password: ''
  port: 1883
  use_tls: false
  user: ''
coverage:
  max_waypoints: 2000
  min_turn_radius_m: 0.0
  mow_width_m: 0.5
  overlap_pct: 10.0
  stripe_point_spacing_m: 1.0
  sweep_angle_deg: null
docker_containers:
  app:
    container_name: mowbot_app
  bringup_and_sensing:
    container_name:
    - mowbot_uros_agent
    - mowbot_bringup_and_sensing
  localization:
    container_name: mowbot_localization
  navigation:
    container_name: mowbot_navigation
docker_reset_on_startup: false
docker_startup_sequence:
- key: bringup_and_sensing
  settle_time_s: 5
- key: localization
  settle_time_s: 5
- key: navigation
  settle_time_s: 3
- key: app
  settle_time_s: 2
general:
  manufacturer: 'MowbotTech'
  map_id: mowbot_field
  serial_number: 'mowbot_001'
map:
  initial_latitude: 36.575298
  initial_longitude: 128.676573
missions:
  max_start_distance_m: 50.0
network:
  check_interval_seconds: 1.0
recording:
  sample_interval_s: 2.0
teach_in:
  poly_max_close_gap_m: 5.0
  poly_min_area_m2: 0.0
  poly_reject_self_intersection: true
  post_process:
    corner_threshold_deg: 15.0
    enable: true
    min_dist_m: 0.2
    rdp_epsilon_path_m: 0.2
    rdp_epsilon_poly_m: 0.15
  recording:
    sample_interval_s: 2.0
